name: release-please

# Main is the publication boundary. Wait for BOTH main-push suites before
# preparing a version PR or cutting its release. Never release from dev.
on:
  workflow_run:
    workflows: [CI, E2E]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-please
    permissions:
      contents: read
      actions: read
      pull-requests: write # GITHUB_TOKEN approves only the guarded bot version PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Require successful CI and E2E for the current main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/release_guard.py check-main --sha "$TRIGGER_SHA"
      - name: Require the release app configuration
        if: steps.gate.outputs.ready == 'true'
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$APP_KEY" || {
            echo '::error::Configure RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY; see sdkgen/RELEASING.md.'
            exit 1
          }
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        if: steps.gate.outputs.ready == 'true'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: future-agi
          repositories: futureagi-sdk
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        if: steps.gate.outputs.ready == 'true'
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Reconcile the outstanding version PR, including unchanged retries
        if: steps.gate.outputs.ready == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        # release-please emits no prs_created output for an unchanged PR. A
        # previous failed approval must not leave that PR permanently stranded.
        run: python .github/scripts/release_guard.py reconcile --bot "$BOT"
      - name: Validate and approve only generated version changes
        if: steps.candidate.outputs.number != ''
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.candidate.outputs.number }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          python .github/scripts/release_guard.py approve --number "$NUMBER" --bot "$BOT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Queue the validated release PR behind required checks
        if: steps.approval.outputs.head != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.approval.outputs.number }}
          HEAD: ${{ steps.approval.outputs.head }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          # Recheck the full approved snapshot (base, draft, author, repositories, current main)
          # immediately before queueing; any change refuses and nothing is queued.
          python .github/scripts/release_guard.py revalidate --number "$NUMBER" --head "$HEAD" --bot "$BOT"
          # Compare-and-swap against the exact diff the guard approved.
          # No --admin or bypass: normal protected-branch checks still apply.
          gh pr merge --auto --squash --match-head-commit "$HEAD" "$NUMBER"
      - name: Request publication of new tags from the main workflow
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PYTHON_TAG: ${{ steps.release.outputs['python--tag_name'] }}
          TYPESCRIPT_TAG: ${{ steps.release.outputs['typescript/futureagi--tag_name'] }}
        run: |
          # Dispatch publish.yml explicitly on main with the app token (Actions: write).
          # Both OIDC providers keep one stable workflow identity, including retries.
          for tag in "$PYTHON_TAG" "$TYPESCRIPT_TAG"; do
            [ -n "$tag" ] || continue
            gh workflow run publish.yml --ref main -f tag="$tag"
          done
