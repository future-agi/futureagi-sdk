name: SDK Package Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
      - "release/**"
      - "releases/**"
    tags-ignore:
      - "**"

permissions:
  contents: read

concurrency:
  group: sdk-package-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-checks:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python SDK
        run: |
          python -m pip install --upgrade pip
          # The import sweep needs base plus every non-evals extra; provider contracts need evals.
          # Keep dev test pins aligned with python/pyproject.toml.
          python -m pip install -e "./python[evals,tracing,experiments,langgraph,langchain,openai-agents,openai,gateway-tokens,gateway-otel]" "pytest>=8.3.3,<9" "pytest-asyncio>=0.24,<0.25" respx pyyaml "openai-agents==0.4.2" "mcp==1.12.4" langgraph build

      - name: Run Python tests
        run: PYTHONPATH=python pytest -q python/tests

      - name: Build Python package
        run: python -m build python

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          package_json_file: typescript/futureagi/package.json
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/futureagi/pnpm-lock.yaml

      - name: Install TypeScript SDK
        working-directory: typescript/futureagi
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Type check TypeScript SDK
        working-directory: typescript/futureagi
        run: pnpm run typecheck

      - name: Run TypeScript tests
        working-directory: typescript/futureagi
        run: pnpm run test --runInBand

      - name: Build TypeScript SDK
        working-directory: typescript/futureagi
        run: pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/futureagi/go.sum

      - name: Test Go SDK
        working-directory: go/futureagi
        run: go test ./...

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/futureagi/pom.xml

      - name: Build Java SDK
        run: mvn -B -f java/futureagi/pom.xml -DskipTests package
