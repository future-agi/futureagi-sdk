name: Workflow Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
      - "release/**"
      - "releases/**"
    tags-ignore:
      - "**"

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Workflow policy and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install policy parser
        run: python -m pip install -r .github/ci/requirements.txt
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Fast workflow checks
        run: bash .github/ci/check-workflows.sh
