name: CI

# Fast checks on every pull request and on dev/main: the generated code is
# current, the Python SDK's unit suite passes on the oldest and newest
# supported interpreters, and the TypeScript package type-checks, tests and
# builds. Nothing here talks to a backend; that is e2e.yml. The MCP parity
# check reads the product's tool list at the pinned release on main and at
# one paired product commit everywhere else
# (.github/scripts/resolve_product_ref.py).

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      product-ref:
        description: "future-agi branch, tag or full commit to pair with (default: the pinned release in sdkgen/contracts/BACKEND_VERSION)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The scoped sync records the SDK target to compare against.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the generator's dependencies
        run: python -m pip install --quiet pyyaml ruff
      - name: Regenerate and compare
        # Fails when a generated file (fi/platform/{models,_operations}.py,
        # fi/platform/resources/{base,__init__}.py, their TypeScript twins)
        # differs from what the contract and catalog produce, or when a
        # resource scaffold is missing.
        run: python sdkgen/generate.py --check
      - name: Non-Skills operations match their SDK baseline
        run: python sdkgen/check_skills_baseline.py
      - name: Pick the product revision to pair with
        id: product
        # pinned: a push to main, a pull request into main, or a dispatch without
        # product-ref compares with the release in sdkgen/contracts/BACKEND_VERSION,
        # as before. paired: pull requests into dev or other branches, pushes to
        # dev, and dispatches with product-ref compare with one product commit:
        # the dispatched one, or the first of the PR head branch, its base (the
        # pushed branch), dev and main that exists. A branch that exists but lacks
        # a required file fails the run; it is never passed over.
        env:
          PRODUCT_REF_INPUT: ${{ inputs.product-ref }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python .github/scripts/resolve_product_ref.py
      - name: Catalog MCP names match the monorepo's tool list at the pinned backend release
        # The catalog records, per operation, the MCP tool it corresponds to; the
        # tool list is generated in the monorepo. Compared at the release in
        # sdkgen/contracts/BACKEND_VERSION, so a backend sync that brings new tools
        # fails here until the catalog gets their entries.
        if: steps.product.outputs.mode == 'pinned'
        run: python sdkgen/check_mcp_parity.py --ref "$(tr -d '[:space:]' < sdkgen/contracts/BACKEND_VERSION)"
      - name: Check out the paired product commit (contract and MCP catalog only)
        id: product_checkout
        if: steps.product.outputs.mode == 'paired'
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: ${{ steps.product.outputs.sha }}
          path: future-agi
          sparse-checkout: |
            api_contracts/openapi
            futureagi/mcp_server/catalog
          fetch-depth: 1
          persist-credentials: false
      - name: The scoped contract slice matches the paired product commit
        # sdkgen/pair_check.py: the scoped sync's own checks
        # (sync_scoped_contract.check_scopes: the SQL, Epoch and Skills tool sets, their
        # exposure, routes, inputs and epoch descriptions) pass against the
        # product commit, the scoped operations and their definitions project
        # identically from that commit and from sdkgen/contracts/swagger.json,
        # and pair.json records the commit, the branch it came from and the
        # product file hashes.
        if: steps.product.outputs.mode == 'paired'
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          PRODUCT_BRANCH: ${{ steps.product.outputs.branch }}
        run: python sdkgen/pair_check.py --product future-agi --sha "$PRODUCT_SHA" --branch "$PRODUCT_BRANCH" --out "$RUNNER_TEMP/pair/pair.json"
      - name: Catalog MCP names match the paired product commit's tool list (both directions)
        # Reported even when the slice check above failed, so one run shows both.
        if: ${{ !cancelled() && steps.product.outputs.mode == 'paired' }}
        run: python sdkgen/check_mcp_parity.py --tools future-agi/futureagi/mcp_server/catalog/tools.generated.json
      - name: Upload the product pairing record
        if: ${{ !cancelled() && steps.product.outputs.mode == 'paired' && steps.product_checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pair-ci
          path: ${{ runner.temp }}/pair/pair.json
          if-no-files-found: error
      - name: Fail closed on an unknown pairing mode
        if: steps.product.outputs.mode != 'pinned' && steps.product.outputs.mode != 'paired'
        run: |
          echo "::error::no pairing mode for this event"
          exit 1
      - name: Lint the generator, the platform client and its tests
        run: ruff check --isolated --select E,F,W,I --ignore E501 sdkgen python/fi/platform python/tests/platform python/fi/context python/fi/skills python/fi/telemetry python/tests/r3_l10 python/tests/r3_l11 python/tests/r3_integration python/tests/telemetry python/consumer/context_consumer.py

  python:
    name: Python ${{ matrix.python }}
    # ubuntu-latest became Ubuntu 26.04 on 2026-11-06 and actions/setup-python has no
    # 3.9 build for it ("The version '3.9' ... was not found for Ubuntu 26.04"). Pin the
    # jobs that run the 3.9 floor to 24.04 until the floor moves to 3.10.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml: python > 3.9. The floor is where typing and
        # pydantic differences show up.
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install the SDK and the test dependencies
        # The dev group in pyproject.toml, without poetry.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python pytest pytest-asyncio respx pyyaml
      - name: Unit tests
        # python/tests/platform's live tests skip without a backend; e2e.yml
        # runs them for real.
        # This leg deliberately has no tracing extras (traceAI does not support 3.9).
        # context-backend runs the entire telemetry suite with its real prerequisites.
        run: |
          PYTHONPATH=python python -m pytest -q python/tests --ignore=python/tests/r3_l10/test_deepagents.py --ignore=python/tests/telemetry
          PYTHONPATH=python python -m pytest -q python/tests/telemetry/test_no_otel.py

  context-backend:
    name: Context backend protocol (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Resolve the traceAI branch to one commit (head, base, dev, main)
        id: pair
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          # Read one upstream advertisement: a network error is not a missing branch.
          refs="$RUNNER_TEMP/traceai-heads"
          git ls-remote --heads https://github.com/future-agi/traceAI.git > "$refs"
          for branch in "$HEAD_BRANCH" "$BASE_BRANCH" dev main; do
            [[ -n "$branch" ]] || continue
            tip=$(awk -v ref="refs/heads/$branch" '$2 == ref {print $1}' "$refs")
            [[ -n "$tip" ]] || continue
            [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || exit 1
            printf 'Pairing with traceAI %s at %s\n' "$branch" "$tip"
            echo "commit=$tip" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo '::error::No matching traceAI branch'; exit 1
      - uses: actions/checkout@v4
        with:
          repository: future-agi/traceAI
          ref: ${{ steps.pair.outputs.commit }}
          path: .traceai
          persist-credentials: false
      - name: Build the paired wheel and install all telemetry and backend prerequisites
        run: |
          python -m pip wheel --no-deps .traceai/python --wheel-dir "$RUNNER_TEMP/paired-wheels"
          python -m pip install -e './python[context-deepagents,otel]' "$RUNNER_TEMP"/paired-wheels/fi_instrumentation_otel-*.whl pytest pytest-asyncio respx pyyaml
          python -c 'import deepagents, fi_instrumentation.otel, opentelemetry.sdk.trace'
      - name: Required real backend conformance and snapshot/materializer integration
        # No importorskip or substitute backend. This tests the real backend
        # protocol without model calls; it does not certify native delivery.
        run: |
          PYTHONPATH=python flock /tmp/ctxhub-pytest.lock python -m pytest -q python/tests/r3_l10 python/tests/r3_l11 python/tests/r3_integration python/tests/telemetry
          PYTHONPATH=python flock /tmp/ctxhub-pytest.lock python python/tests/r3_l11/integration_snapshot_probe.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript/futureagi
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/futureagi/pnpm-lock.yaml
      - name: Install
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests (platform client)
        # src/kb and src/annotations carry jest suites that fail on dev as
        # well (pre-existing); they are not part of the gate until fixed.
        run: pnpm test -- src/platform
      - name: Build (CJS, ESM, ESNext)
        run: pnpm run build
      - name: Skills, Context and telemetry (including installed package without the optional peer)
        run: pnpm exec jest --runInBand src/__tests__/r3_l10 src/__tests__/telemetry

  packages:
    name: Packages as installed
    # What a user's project sees, not what this repository's sources see: the
    # wheel installed into an empty virtualenv, the npm tarball installed into
    # an empty project. python/consumer/consumer.py and
    # typescript/futureagi/consumer/consumer-types.mts hold the public calls
    # that must run and type-check from there (mypy --strict, tsc --strict),
    # and every example in the generated reference (docs/sdk-reference) must
    # bind (Python) and compile (TypeScript) against the installed package.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        working-directory: python
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
      - name: Install the wheel into an empty virtualenv, run and type-check the consumer
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/pip" install --quiet python/dist/*.whl mypy pytest pytest-asyncio pyyaml
          cp python/consumer/*.py "$RUNNER_TEMP/consumer/"
          mkdir -p "$RUNNER_TEMP/consumer/python/tests" "$RUNNER_TEMP/consumer/.github/actions"
          cp -R python/tests/r3_l10 python/tests/r3_l11 "$RUNNER_TEMP/consumer/python/tests/"
          cp -R .github/actions/context-verify "$RUNNER_TEMP/consumer/.github/actions/"
          ACTION_PATH="$RUNNER_TEMP/consumer/.github/actions/context-verify/action.yml"
          cd "$RUNNER_TEMP/consumer"
          unset PYTHONPATH
          ./bin/python consumer.py
          ./bin/python context_consumer.py
          ./bin/python -m mypy --strict --follow-imports=silent consumer.py context_consumer.py
          flock /tmp/ctxhub-pytest.lock ./bin/python -m pytest -q --asyncio-mode=auto python/tests/r3_l10 python/tests/r3_l11 --ignore=python/tests/r3_l10/test_deepagents.py
          ./bin/python python/tests/r3_l11/integration_snapshot_probe.py
          ./bin/python python/tests/r3_l11/package_action_probe.py "$ACTION_PATH"
          ./bin/python docs_examples.py "$GITHUB_WORKSPACE/docs/sdk-reference"
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/futureagi/pnpm-lock.yaml
      - name: Build the npm package
        working-directory: typescript/futureagi
        run: |
          pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Install the packed tarball into an empty project, compile and load the consumer
        working-directory: typescript/futureagi
        run: pnpm run check:consumer

  release-guards:
    name: Release authorization guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release-only approval and main-only publication gates
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  ci-pass:
    name: CI Pass
    needs: [generated, python, context-backend, typescript, packages, release-guards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq 'with_entries(.value |= .result)
            | to_entries
            | map(select(.value != "success"))
            | if length > 0 then ("failing: " + (map(.key) | join(", ")) | halt_error)
              else "all jobs green" end'
