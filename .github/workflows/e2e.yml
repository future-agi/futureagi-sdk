name: E2E

# The SDKs against a real backend. Boots the Future AGI Standalone setup the
# way the monorepo's own E2E CI does (docker-compose.yml plus the
# e2e/stack/standalone-e2e overlay: one app container, Postgres, ClickHouse and
# the deterministic mock LLM), signs up a fresh account, and runs the live
# suites: python/tests/platform calls every catalog operation,
# src/platform/__tests__/live.test.ts covers the TypeScript transport.
#
# The backend is the release the contract slice came from
# (sdkgen/contracts/BACKEND_VERSION, written by sync_contract.py and bumped by
# the monorepo's sdk-sync workflow on every release) unless the run is
# dispatched with another tag; the nightly run uses :latest to catch drift.
# The compose files come from the same release tag as the image (main for
# :latest): a newer stack definition can mount code or gateway config that an
# older image cannot load, and the app then exits before it is healthy.
# The v1.59.0 stack is missing one read-only E2E mount (future-agi#4200);
# only that verified release pair gets the compatibility overlay below.
# The monorepo runs the same suites against every pull request's own build in
# its E2E CI, so a backend change that breaks the SDK fails there before it is
# released.
#
# Which backend, by event (.github/scripts/resolve_product_ref.py):
#   pinned  a push to main, a pull request into main, or a dispatch with
#           backend-version/backend-ref: the release image above, unchanged.
#   latest  the nightly run: :latest with main's stack, unchanged.
#   paired  every other run (pull requests into dev or other branches, pushes
#           to dev, other dispatches): one product commit, resolved from the PR
#           head branch, then its base (the pushed branch), then dev, then main,
#           or the dispatched product-ref. The Standalone image is built from
#           that commit the way the monorepo's E2E CI builds it, pushed to a
#           registry on the runner and run by digest, with the stack files and
#           the SQL fixture helper from the same commit. The job uploads
#           pair.json (sdkgen/pair_check.py) with the commit, the branch, the
#           contract hashes, the image digests and the helper's hash.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Nightly against the newest release: catches a backend release that drifts
  # from the SDK between pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      backend-version:
        description: "futureagi/standalone image tag to test against (default: sdkgen/contracts/BACKEND_VERSION)"
        required: false
        type: string
      backend-ref:
        description: "future-agi ref that provides the compose files (default: the backend version's tag, main for latest)"
        required: false
        type: string
      product-ref:
        description: "future-agi branch, tag or full commit to build and pair with instead of a release (not with backend-version/backend-ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # e2e/stack/standalone-e2e.env maps the app's API onto this port.
  FI_BASE_URL: http://localhost:8100
  # Make the live suites fail, not skip, when no account was provisioned.
  FI_E2E_REQUIRED: "1"

jobs:
  e2e:
    name: e2e (python ${{ matrix.python }}${{ matrix.typescript && ', typescript' || '' }})
    # ubuntu-latest became Ubuntu 26.04 on 2026-11-06 and actions/setup-python has no
    # 3.9 build for it ("The version '3.9' ... was not found for Ubuntu 26.04"). Pin the
    # jobs that run the 3.9 floor to 24.04 until the floor moves to 3.10.
    runs-on: ubuntu-24.04
    # Paired runs build the Standalone image from source first (no layer cache).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor and a current interpreter; TypeScript rides along once.
          - python: "3.9"
            typescript: false
          - python: "3.12"
            typescript: true
    steps:
      - uses: actions/checkout@v4

      - name: Pick the product revision to pair with
        id: product
        env:
          PRODUCT_REF_INPUT: ${{ inputs.product-ref }}
          BACKEND_VERSION_INPUT: ${{ inputs.backend-version }}
          BACKEND_REF_INPUT: ${{ inputs.backend-ref }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          python3 .github/scripts/resolve_product_ref.py
          case "$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -1)" in
            pinned|latest|paired) ;;
            *) echo '::error::no pairing mode for this event'; exit 1 ;;
          esac

      - name: Pick the backend image tag and its stack definition
        if: steps.product.outputs.mode == 'pinned' || steps.product.outputs.mode == 'latest'
        env:
          DISPATCHED: ${{ inputs.backend-version }}
          DISPATCHED_REF: ${{ inputs.backend-ref }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            version="$DISPATCHED"
          elif [ "${{ github.event_name }}" = schedule ]; then
            version=latest
          else
            version=$(tr -d '[:space:]' < sdkgen/contracts/BACKEND_VERSION)
          fi
          # Every release image is tagged like its monorepo release (vX.Y.Z), so
          # the stack comes from that tag. Nightly selects main, independently
          # of which source revision was used to publish the latest image.
          if [ -n "$DISPATCHED_REF" ]; then
            ref="$DISPATCHED_REF"
          elif [ "$version" = latest ]; then
            ref=main
          else
            ref="$version"
          fi
          if [[ "$version" == latest ]]; then
            source=refs/heads/main
          elif [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            source="refs/tags/$version"
          else
            echo '::error::expected latest or a release version'; exit 1
          fi
          if [[ "$ref" != "$source" && "$ref" != "${source##*/}" && ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::stack ref must match the selected release tag or latest/main'; exit 1
          fi
          # Always check out the canonical upstream ref. An explicit commit is
          # an assertion about that ref, not permission to run another stack.
          echo "STACK_SOURCE=$source" >> "$GITHUB_ENV"
          echo "BACKEND_VERSION=${version:?no backend version}" >> "$GITHUB_ENV"
          echo "BACKEND_REF=${ref:?no stack ref}" >> "$GITHUB_ENV"
          echo "backend: futureagi/standalone:$version, stack: future-agi@$ref"

      - name: Check out the monorepo's stack definition
        # Only the files docker-compose.yml and the E2E overlay mount; the
        # app itself is the published image.
        if: steps.product.outputs.mode == 'pinned' || steps.product.outputs.mode == 'latest'
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: ${{ env.STACK_SOURCE }}
          path: future-agi
          sparse-checkout: |
            e2e/stack
            deploy/clickhouse
            deploy/standalone/clickhouse
            futureagi/.ci
          fetch-depth: 1

      - name: Boot the Standalone stack
        id: boot
        if: steps.product.outputs.mode == 'pinned' || steps.product.outputs.mode == 'latest'
        working-directory: future-agi
        env:
          FUTURE_AGI_VERSION: ${{ env.BACKEND_VERSION }}
        run: |
          set -o pipefail
          head=$(git rev-parse HEAD)
          if [[ "$BACKEND_REF" =~ ^[0-9a-f]{40}$ && "$head" != "$BACKEND_REF" ]]; then
            echo '::error::explicit commit does not match the selected upstream ref'; exit 1
          fi
          echo "stack $STACK_SOURCE at $head"
          # Only the reviewed helper may reach app stdin, even on moving main.
          helper=e2e/stack/backend/bootstrap_sql.py
          sql="$RUNNER_TEMP/sdk-bootstrap-sql.py"
          git show "$head:$helper" > "$sql"
          test ! -L "$helper" && cmp "$sql" "$helper" || exit 1
          echo "a06b2450979431bd6042fa46b17be9a255caa9a7cd2b287e934e5315cd8a8f6c  $sql" | sha256sum --check
          files=(-f docker-compose.yml -f e2e/stack/docker-compose.standalone-e2e.yml)
          if [[ "$FUTURE_AGI_VERSION" == v1.59.0 ]]; then
            compat="$RUNNER_TEMP/sdk-v1.59.0.yml"
            python3 "$GITHUB_WORKSPACE/.github/scripts/release_stack.py" > "$compat"
            files+=(-f "$compat")
          fi
          compose=(docker compose --env-file e2e/stack/standalone-e2e.env "${files[@]}" -p futureagi-e2e-standalone)
          selector=$("${compose[@]}" config --format json | jq -er '.services.app.image')
          image="futureagi/standalone:$FUTURE_AGI_VERSION"
          if [[ "$FUTURE_AGI_VERSION" == v1.59.0 ]]; then
            [[ "$selector" == "$image"@sha256:* ]]  # release_stack.py binds the verified index
          else
            [[ "$selector" == "$image" ]]
          fi
          rc=0
          "${compose[@]}" up -d --wait --wait-timeout 1500 app postgres clickhouse mock-llm || rc=$?
          # Report the *actual container's* repository digest, including on
          # unhealthy boots. Never infer an image's source commit from its tag.
          app=$("${compose[@]}" ps -a -q app)
          [[ "$(docker inspect -f '{{.Config.Image}}' "$app")" == "$selector" ]]
          iid=$(docker inspect -f '{{.Image}}' "$app")
          digest=$(docker image inspect "$iid" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Ex 'futureagi/standalone@sha256:[a-f0-9]{64}' | sort -u)
          [[ "$digest" =~ ^futureagi/standalone@sha256:[a-f0-9]{64}$ ]]
          echo "app $selector => $digest (image ID $iid); stack $head"
          (( rc == 0 )) || exit "$rc"
          # A first boot migrates an empty database before the API answers.
          deadline=$((SECONDS + 1500))
          until curl -fsS "$FI_BASE_URL/health/" >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "::error::backend not healthy on $FI_BASE_URL in 1500s"
              exit 1
            fi
            sleep 5
          done
          echo "backend healthy after ${SECONDS}s"

      - name: Check out the paired product commit
        # The whole tree: the image is built from it.
        if: steps.product.outputs.mode == 'paired'
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: ${{ steps.product.outputs.sha }}
          path: future-agi
          fetch-depth: 1
          persist-credentials: false

      - name: Build the paired commit's Standalone image from source
        # The images, build arguments and order of the monorepo's E2E CI
        # (e2e-ci.yml, Standalone leg): the slim backend plus its E2E-only
        # layer, the frontend plus its E2E asset layer, fi-collector and
        # agentcc-gateway, then `bin/e2e build standalone-app` on the docker
        # driver. Without the monorepo's ghcr layer cache, which this
        # repository cannot read, so every build is cold.
        id: build_paired
        if: steps.product.outputs.mode == 'paired'
        working-directory: future-agi
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          RECLAIM_DELETE: background
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [[ "$head" != "$PRODUCT_SHA" ]]; then
            echo '::error::product checkout does not match the resolved commit'; exit 1
          fi
          # Docker's data moves to /mnt: before any build or container exists.
          scripts/reclaim-runner-disk.sh
          tag=$(sed -n 's/^FUTURE_AGI_VERSION=//p' e2e/stack/standalone-e2e.env)
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo '::error::no usable FUTURE_AGI_VERSION in e2e/stack/standalone-e2e.env'; exit 1
          fi
          echo "PAIRED_TAG=$tag" >> "$GITHUB_ENV"
          docker build --build-arg IMAGE_VARIANT=slim -t "futureagi/future-agi:$tag" -f futureagi/Dockerfile.oss futureagi
          docker build --build-arg BASE_TAG="$tag" -t "futureagi/future-agi:$tag" -f e2e/stack/backend/Dockerfile .
          docker build -t "futureagi/frontend:$tag" -f frontend/Dockerfile frontend
          docker build --build-arg BASE_TAG="$tag" -t "futureagi/frontend:$tag" -f e2e/stack/frontend/Dockerfile .
          docker build -t "futureagi/fi-collector:$tag" -f fi-collector/Dockerfile fi-collector
          docker build -t "futureagi/agentcc-gateway:$tag" -f agentcc-gateway/Dockerfile agentcc-gateway
          BUILDX_BUILDER=default E2E_STACK=standalone bin/e2e build standalone-app
          # The build cache is a second copy of every layer; nothing reuses it.
          docker buildx prune -af >/dev/null || true
          df -h / /mnt || true

      - name: Pin the built images by registry digest
        # A tag is never the identity here: the images go to a registry on this
        # runner, Compose runs them by the digest that registry reports, and the
        # by-digest image must be the image just built.
        id: pin_paired
        if: steps.product.outputs.mode == 'paired'
        env:
          REGISTRY_IMAGE: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        run: |
          set -euo pipefail
          docker run -d --name sdk-pair-registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE" >/dev/null
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done'
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          pin() { # image name, env prefix
            local built="futureagi/$1:$PAIRED_TAG" remote="localhost:5000/futureagi/$1" digest ref built_id pinned_id
            built_id=$(docker image inspect --format '{{.Id}}' "$built")
            docker tag "$built" "$remote:$PAIRED_TAG"
            docker push --quiet "$remote:$PAIRED_TAG" >/dev/null
            digest=$(curl -fsSI -H "Accept: $accept" "http://127.0.0.1:5000/v2/futureagi/$1/manifests/$PAIRED_TAG" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::the runner registry reported no digest for $remote:$PAIRED_TAG"; return 1
            fi
            ref="$remote@$digest"
            docker pull --quiet "$ref" >/dev/null
            pinned_id=$(docker image inspect --format '{{.Id}}' "$ref")
            if [[ ! "$built_id" =~ ^sha256:[a-f0-9]{64}$ || "$pinned_id" != "$built_id" ]]; then
              echo "::error::$ref is not the image built as $built"; return 1
            fi
            echo "$1: $ref (image ID $built_id)"
            { echo "${2}_IMAGE=$ref"; echo "${2}_DIGEST=$digest"; echo "${2}_ID=$built_id"; } >> "$GITHUB_ENV"
            printf '%s\n' "$ref" > "$RUNNER_TEMP/sdk-paired-$1.ref"
          }
          pin standalone PAIRED_APP
          pin future-agi PAIRED_GOOGLE
          # app runs the assembled image; mock-google, which app depends on,
          # runs the backend image instead of the overlay's :latest default.
          pinfile="$RUNNER_TEMP/sdk-paired-pin.yml"
          printf 'services:\n  app:\n    image: %s\n  mock-google:\n    image: %s\n' \
            "$(cat "$RUNNER_TEMP/sdk-paired-standalone.ref")" "$(cat "$RUNNER_TEMP/sdk-paired-future-agi.ref")" > "$pinfile"
          echo "PAIRED_PIN=$pinfile" >> "$GITHUB_ENV"

      - name: Boot the Standalone stack from the paired commit
        id: boot_paired
        if: steps.product.outputs.mode == 'paired'
        working-directory: future-agi
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          PRODUCT_BRANCH: ${{ steps.product.outputs.branch }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          [[ "$head" == "$PRODUCT_SHA" ]]
          # The SQL fixture helper from the commit the image was built from;
          # its hash goes into pair.json instead of a fixed pin.
          helper=e2e/stack/backend/bootstrap_sql.py
          sql="$RUNNER_TEMP/sdk-bootstrap-sql.py"
          [[ "$(git ls-tree "$head" -- "$helper" | cut -d' ' -f1)" == 100644 ]]
          git show "$head:$helper" > "$sql"
          test ! -L "$helper" && cmp "$sql" "$helper" || exit 1
          bootstrap=$(sha256sum "$sql" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/pair"
          jq -n --arg tag "$PAIRED_TAG" --arg stack "$head" --arg bootstrap "$bootstrap" \
            --arg app "$PAIRED_APP_IMAGE" --arg app_digest "$PAIRED_APP_DIGEST" --arg app_id "$PAIRED_APP_ID" \
            --arg google "$PAIRED_GOOGLE_IMAGE" --arg google_digest "$PAIRED_GOOGLE_DIGEST" --arg google_id "$PAIRED_GOOGLE_ID" \
            '{image_tag: $tag, stack_commit: $stack, bootstrap_sql_sha256: $bootstrap,
              app_image: $app, app_image_digest: $app_digest, app_image_id: $app_id,
              mock_google_image: $google, mock_google_image_digest: $google_digest, mock_google_image_id: $google_id}' \
            > "$RUNNER_TEMP/pair/stack.json"
          compose=(docker compose --env-file e2e/stack/standalone-e2e.env -f docker-compose.yml -f e2e/stack/docker-compose.standalone-e2e.yml -f "$PAIRED_PIN" -p futureagi-e2e-standalone)
          config=$("${compose[@]}" config --format json)
          [[ "$(jq -er '.services.app.image' <<<"$config")" == "$PAIRED_APP_IMAGE" ]]
          [[ "$(jq -er '.services["mock-google"].image' <<<"$config")" == "$PAIRED_GOOGLE_IMAGE" ]]
          rc=0
          "${compose[@]}" up -d --wait --wait-timeout 1500 app postgres clickhouse mock-llm || rc=$?
          # The *running containers* must be the pinned images, including on
          # unhealthy boots.
          for service in app mock-google; do
            if [[ "$service" == app ]]; then want="$PAIRED_APP_IMAGE $PAIRED_APP_ID"; else want="$PAIRED_GOOGLE_IMAGE $PAIRED_GOOGLE_ID"; fi
            container=$("${compose[@]}" ps -a -q "$service")
            [[ "$container" =~ ^[0-9a-f]+$ ]] || { echo "::error::expected one $service container"; exit 1; }
            running=$(docker inspect -f '{{.Config.Image}} {{.Image}}' "$container")
            [[ "$running" == "$want" ]] || { echo "::error::$service runs $running, not $want"; exit 1; }
          done
          echo "app $PAIRED_APP_IMAGE (image ID $PAIRED_APP_ID); stack and image from future-agi@$head ($PRODUCT_BRANCH)"
          (( rc == 0 )) || exit "$rc"
          # A first boot migrates an empty database before the API answers.
          deadline=$((SECONDS + 1500))
          until curl -fsS "$FI_BASE_URL/health/" >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "::error::backend not healthy on $FI_BASE_URL in 1500s"
              exit 1
            fi
            sleep 5
          done
          echo "backend healthy after ${SECONDS}s"

      - name: Provision the standalone SQL fixture
        working-directory: future-agi
        run: |
          # exec targets the already booted project; it does not recreate app.
          compose=(docker compose --env-file e2e/stack/standalone-e2e.env -f docker-compose.yml -f e2e/stack/docker-compose.standalone-e2e.yml -p futureagi-e2e-standalone)
          # Every live suite needs this account. Mirror bin/e2e wait_ready:
          # health, storage schema, then the guarded standalone SQL helper.
          "${compose[@]}" exec -T clickhouse clickhouse-client --query 'SELECT count() FROM spans LIMIT 0'
          "${compose[@]}" exec -T clickhouse clickhouse-client --param_database="${PROPERTY_CATALOG_DATABASE:-property_catalog}" \
            --query "SELECT throwIf(count() != 2, 'observed indexes missing') FROM system.tables WHERE database={database:String} AND name IN ('observed_attribute_keys', 'observed_attribute_values')"
          "${compose[@]}" exec -T -w /app/backend -e FUTURE_AGI_E2E_FIXTURE=sql-workbench \
            app python - < "$RUNNER_TEMP/sdk-bootstrap-sql.py"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the Python SDK
        id: install_sdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python pytest pyyaml

      - name: Sign up an account and write .env.local
        run: python sdkgen/local_api_key.py --signup --base-url "$FI_BASE_URL" --label "gh${{ github.run_id }}"

      - name: Python live suite (every catalog operation)
        run: PYTHONPATH=python pytest -q python/tests/platform

      - uses: pnpm/action-setup@v4
        if: matrix.typescript
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        if: matrix.typescript
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/futureagi/pnpm-lock.yaml
      - name: Install the TypeScript SDK
        if: matrix.typescript
        working-directory: typescript/futureagi
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: TypeScript live suite
        if: matrix.typescript
        working-directory: typescript/futureagi
        run: pnpm run test:live

      - name: Record the product pairing
        # After the suites, so a slice mismatch does not hide their results.
        if: ${{ !cancelled() && steps.product.outputs.mode == 'paired' && steps.install_sdk.outcome == 'success' }}
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          PRODUCT_BRANCH: ${{ steps.product.outputs.branch }}
        run: >
          python sdkgen/pair_check.py --product future-agi --sha "$PRODUCT_SHA" --branch "$PRODUCT_BRANCH"
          --extra-json "$RUNNER_TEMP/pair/stack.json" --out "$RUNNER_TEMP/pair/pair.json"

      - name: Upload the product pairing record
        if: ${{ !cancelled() && steps.product.outputs.mode == 'paired' && steps.boot_paired.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: pair-e2e-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pair/
          if-no-files-found: error

      - name: Dump the stack on failure
        if: failure()
        working-directory: future-agi
        run: |
          docker compose -p futureagi-e2e-standalone ps
          docker compose -p futureagi-e2e-standalone logs --tail 200 app

      - name: Tear the stack down
        if: always() && (steps.boot.outcome != 'skipped' || steps.boot_paired.outcome != 'skipped')
        working-directory: future-agi
        run: |
          docker compose -p futureagi-e2e-standalone down -v --remove-orphans || true
          docker rm -f sdk-pair-registry >/dev/null 2>&1 || true

  e2e-tests:
    name: E2E Tests Pass
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq 'with_entries(.value |= .result)
            | to_entries
            | map(select(.value != "success"))
            | if length > 0 then ("failing: " + (map(.key) | join(", ")) | halt_error)
              else "all legs green" end'
