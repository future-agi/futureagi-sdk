name: E2E

# The SDKs against a real backend. Boots the Future AGI Standalone setup the
# way the monorepo's own E2E CI does (docker-compose.yml plus the
# e2e/stack/standalone-e2e overlay: one app container, Postgres, ClickHouse and
# the deterministic mock LLM), signs up a fresh account, and runs the live
# suites: python/tests/platform calls every catalog operation,
# src/platform/__tests__/live.test.ts covers the TypeScript transport.
#
# The backend is the release the contract slice came from
# (sdkgen/contracts/BACKEND_VERSION, written by sync_contract.py and bumped by
# the monorepo's sdk-sync workflow on every release) unless the run is
# dispatched with another tag; the nightly run uses :latest to catch drift.
# The compose files come from the same release tag as the image (main for
# :latest): a newer stack definition can mount code or gateway config that an
# older image cannot load, and the app then exits before it is healthy.
# The v1.59.0 stack is missing one read-only E2E mount (future-agi#4200);
# only that verified release pair gets the compatibility overlay below.
# The monorepo runs the same suites against every pull request's own build in
# its E2E CI, so a backend change that breaks the SDK fails there before it is
# released.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Nightly against the newest release: catches a backend release that drifts
  # from the SDK between pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      backend-version:
        description: "futureagi/standalone image tag to test against (default: sdkgen/contracts/BACKEND_VERSION)"
        required: false
        type: string
      backend-ref:
        description: "future-agi ref that provides the compose files (default: the backend version's tag, main for latest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # e2e/stack/standalone-e2e.env maps the app's API onto this port.
  FI_BASE_URL: http://localhost:8100
  # Make the live suites fail, not skip, when no account was provisioned.
  FI_E2E_REQUIRED: "1"

jobs:
  e2e:
    name: e2e (python ${{ matrix.python }}${{ matrix.typescript && ', typescript' || '' }})
    # ubuntu-latest became Ubuntu 26.04 on 2026-11-06 and actions/setup-python has no
    # 3.9 build for it ("The version '3.9' ... was not found for Ubuntu 26.04"). Pin the
    # jobs that run the 3.9 floor to 24.04 until the floor moves to 3.10.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor and a current interpreter; TypeScript rides along once.
          - python: "3.9"
            typescript: false
          - python: "3.12"
            typescript: true
    steps:
      - uses: actions/checkout@v4

      - name: Pick the backend image tag and its stack definition
        env:
          DISPATCHED: ${{ inputs.backend-version }}
          DISPATCHED_REF: ${{ inputs.backend-ref }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            version="$DISPATCHED"
          elif [ "${{ github.event_name }}" = schedule ]; then
            version=latest
          else
            version=$(tr -d '[:space:]' < sdkgen/contracts/BACKEND_VERSION)
          fi
          # Every release image is tagged like its monorepo release (vX.Y.Z), so
          # the stack comes from that tag. Nightly selects main, independently
          # of which source revision was used to publish the latest image.
          if [ -n "$DISPATCHED_REF" ]; then
            ref="$DISPATCHED_REF"
          elif [ "$version" = latest ]; then
            ref=main
          else
            ref="$version"
          fi
          if [[ "$version" == latest ]]; then
            source=refs/heads/main
          elif [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            source="refs/tags/$version"
          else
            echo '::error::expected latest or a release version'; exit 1
          fi
          if [[ "$ref" != "$source" && "$ref" != "${source##*/}" && ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::stack ref must match the selected release tag or latest/main'; exit 1
          fi
          # Always check out the canonical upstream ref. An explicit commit is
          # an assertion about that ref, not permission to run another stack.
          echo "STACK_SOURCE=$source" >> "$GITHUB_ENV"
          echo "BACKEND_VERSION=${version:?no backend version}" >> "$GITHUB_ENV"
          echo "BACKEND_REF=${ref:?no stack ref}" >> "$GITHUB_ENV"
          echo "backend: futureagi/standalone:$version, stack: future-agi@$ref"

      - name: Check out the monorepo's stack definition
        # Only the files docker-compose.yml and the E2E overlay mount; the
        # app itself is the published image.
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: ${{ env.STACK_SOURCE }}
          path: future-agi
          sparse-checkout: |
            e2e/stack
            deploy/clickhouse
            deploy/standalone/clickhouse
            futureagi/.ci
          fetch-depth: 1

      - name: Boot the Standalone stack
        id: boot
        working-directory: future-agi
        env:
          FUTURE_AGI_VERSION: ${{ env.BACKEND_VERSION }}
        run: |
          set -o pipefail
          head=$(git rev-parse HEAD)
          if [[ "$BACKEND_REF" =~ ^[0-9a-f]{40}$ && "$head" != "$BACKEND_REF" ]]; then
            echo '::error::explicit commit does not match the selected upstream ref'; exit 1
          fi
          echo "stack $STACK_SOURCE at $head"
          # Only the reviewed helper may reach app stdin, even on moving main.
          helper=e2e/stack/backend/bootstrap_sql.py
          sql="$RUNNER_TEMP/sdk-bootstrap-sql.py"
          git show "$head:$helper" > "$sql"
          test ! -L "$helper" && cmp "$sql" "$helper" || exit 1
          echo "a06b2450979431bd6042fa46b17be9a255caa9a7cd2b287e934e5315cd8a8f6c  $sql" | sha256sum --check
          files=(-f docker-compose.yml -f e2e/stack/docker-compose.standalone-e2e.yml)
          if [[ "$FUTURE_AGI_VERSION" == v1.59.0 ]]; then
            compat="$RUNNER_TEMP/sdk-v1.59.0.yml"
            python3 "$GITHUB_WORKSPACE/.github/scripts/release_stack.py" > "$compat"
            files+=(-f "$compat")
          fi
          # Exercise the opt-in consumption facade on this disposable backend.
          # An unsupported release fails the live suite; no catalog exclusions.
          cat > "$RUNNER_TEMP/sdk-context.yml" <<'YAML'
          services:
            app:
              environment:
                SKILLS_CONTEXT_CONSUMPTION_ENABLED: "true"
          YAML
          files+=(-f "$RUNNER_TEMP/sdk-context.yml")
          compose=(docker compose --env-file e2e/stack/standalone-e2e.env "${files[@]}" -p futureagi-e2e-standalone)
          selector=$("${compose[@]}" config --format json | jq -er '.services.app.image')
          image="futureagi/standalone:$FUTURE_AGI_VERSION"
          if [[ "$FUTURE_AGI_VERSION" == v1.59.0 ]]; then
            [[ "$selector" == "$image"@sha256:* ]]  # release_stack.py binds the verified index
          else
            [[ "$selector" == "$image" ]]
          fi
          rc=0
          "${compose[@]}" up -d --wait --wait-timeout 1500 app postgres clickhouse mock-llm || rc=$?
          # Report the *actual container's* repository digest, including on
          # unhealthy boots. Never infer an image's source commit from its tag.
          app=$("${compose[@]}" ps -a -q app)
          [[ "$(docker inspect -f '{{.Config.Image}}' "$app")" == "$selector" ]]
          iid=$(docker inspect -f '{{.Image}}' "$app")
          digest=$(docker image inspect "$iid" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Ex 'futureagi/standalone@sha256:[a-f0-9]{64}' | sort -u)
          [[ "$digest" =~ ^futureagi/standalone@sha256:[a-f0-9]{64}$ ]]
          echo "app $selector => $digest (image ID $iid); stack $head"
          (( rc == 0 )) || exit "$rc"
          # A first boot migrates an empty database before the API answers.
          deadline=$((SECONDS + 1500))
          until curl -fsS "$FI_BASE_URL/health/" >/dev/null 2>&1; do
            if (( SECONDS > deadline )); then
              echo "::error::backend not healthy on $FI_BASE_URL in 1500s"
              exit 1
            fi
            sleep 5
          done
          echo "backend healthy after ${SECONDS}s"

      - name: Provision the standalone SQL fixture
        working-directory: future-agi
        run: |
          # exec targets the already booted project; it does not recreate app.
          compose=(docker compose --env-file e2e/stack/standalone-e2e.env -f docker-compose.yml -f e2e/stack/docker-compose.standalone-e2e.yml -p futureagi-e2e-standalone)
          # Every live suite needs this account. Mirror bin/e2e wait_ready:
          # health, storage schema, then the guarded standalone SQL helper.
          "${compose[@]}" exec -T clickhouse clickhouse-client --query 'SELECT count() FROM spans LIMIT 0'
          "${compose[@]}" exec -T clickhouse clickhouse-client --param_database="${PROPERTY_CATALOG_DATABASE:-property_catalog}" \
            --query "SELECT throwIf(count() != 2, 'observed indexes missing') FROM system.tables WHERE database={database:String} AND name IN ('observed_attribute_keys', 'observed_attribute_values')"
          "${compose[@]}" exec -T -w /app/backend -e FUTURE_AGI_E2E_FIXTURE=sql-workbench \
            app python - < "$RUNNER_TEMP/sdk-bootstrap-sql.py"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python pytest pyyaml

      - name: Sign up an account and write .env.local
        run: python sdkgen/local_api_key.py --signup --workspace-user-key --base-url "$FI_BASE_URL" --label "gh${{ github.run_id }}"

      - name: Python live suite (every catalog operation)
        run: PYTHONPATH=python pytest -q python/tests/platform

      - uses: pnpm/action-setup@v4
        if: matrix.typescript
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        if: matrix.typescript
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/futureagi/pnpm-lock.yaml
      - name: Install the TypeScript SDK
        if: matrix.typescript
        working-directory: typescript/futureagi
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: TypeScript live suite
        if: matrix.typescript
        working-directory: typescript/futureagi
        run: pnpm run test:live

      - name: Dump the stack on failure
        if: failure()
        working-directory: future-agi
        run: |
          docker compose -p futureagi-e2e-standalone ps
          docker compose -p futureagi-e2e-standalone logs --tail 200 app

      - name: Tear the stack down
        if: always() && steps.boot.outcome != 'skipped'
        working-directory: future-agi
        run: docker compose -p futureagi-e2e-standalone down -v --remove-orphans || true

  e2e-tests:
    name: E2E Tests Pass
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every leg succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq 'with_entries(.value |= .result)
            | to_entries
            | map(select(.value != "success"))
            | if length > 0 then ("failing: " + (map(.key) | join(", ")) | halt_error)
              else "all legs green" end'
