# Every offered this release option of fi.experiments and the futureagi-py CLI → the real e2e rows that must all
# be GREEN before it ships.
#
# Row ids are stable public conformance identifiers; The conformance suite owns their definitions and the truth
# table (e2e/truth/truth.json). scripts/experiments/release_gate.py fails when any option below has a row
# that is not GREEN. tests/experiments/unit/test_options.py fails when the public surface and
# this file disagree (an orphan in either direction) or an option names no row.
#
# Keys: "py:NAME" (fi.experiments.NAME), "py:run(PARAM)" (a run()/arun() keyword),
# "py:evaluators.NAME", "py:log_results(PARAM)", "cli:COMMAND", "cli:COMMAND FLAG".
#
# holds: an option held NOT READY whatever its rows say, with why, until the hold is lifted here
# (release_gate.py lists it as HOLD). Use it only when a row's GREEN is known not to be evidence.
schema_version: 1
# The judge rate gate passed at two consecutive SDK snapshots under one gate definition.
# Every gate run passed at both snapshots. The retained acceptance record covers B1-B24.
# The public fixture preserves the recorded verdicts and seeded-run counts; the hold stays lifted.
