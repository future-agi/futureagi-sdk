[tool.poetry]
name = "futureagi"
version = "0.7.0"
description = "We help GenAI teams maintain high-accuracy for their Models in production."
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
license = "Apache-2.0"
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    # Outside fi so an older learning-kit wheel cannot overwrite the guard.
    { path = "futureagi_namespace_guard.pth", format = ["wheel", "sdist"] }
]
packages = [
    { include = "fi" },
    { include = "_futureagi_namespace_guard.py" }
]
# Archive exclusions apply to both release formats.
# fi/gateway, the gateway data-plane client, ships in both archives.
exclude = [
    "fi/alk",
    "fi/integrations/otel",
    "fi/deployments",
    "fi/deployments.py",
    "fi/**/__pycache__",
    "fi/**/*.pyc"
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed"
]

[tool.poetry.dependencies]
python = ">=3.10"
certifi = ">=2026.10.18"
charset-normalizer = ">=3.3"
idna = ">=3.15"
numpy = ">=1.26"
pandas = ">=2.0"
python-dateutil = ">=2.9"
pytz = ">=2024.1"
requests = ">=2.33.0"
requests-futures = ">=1.0"
httpx = ">=0.27,<1.0"
anyio = ">=4.14.2,<5.0"
attrs = ">=23.0"
six = ">=1.16"
tzdata = ">=2024.1"
urllib3 = ">=2.8.0"
pydantic = ">=2.9,<3.0"
# fi.gateway imports it at load time (Self, TypedDict, Required); pydantic's own floor.
typing-extensions = ">=4.12.2"
tqdm = ">=4.67"
Levenshtein = "*"
scipy = ">=1.15.0"
jsonschema = ">=4.25"
# fi.experiments extras (instrumentors only, never the framework itself)
fi-instrumentation-otel = {version = ">=1.1.0", optional = true, python = ">=3.10,<3.14"}
python-dotenv = {version = ">=1.0", optional = true}
traceAI-langchain = {version = ">=0.2.0", optional = true, python = ">=3.10,<3.14"}
traceAI-openai-agents = {version = ">=0.1.6", optional = true, python = ">=3.10,<3.14"}
traceAI-openai = {version = ">=0.1.10", optional = true, python = ">=3.10,<3.14"}
# Local metrics, LLM judges and evals OpenTelemetry helpers need Python 3.11+ and futureagi[evals].
# The cloud Evaluator, evaluate(), templates, Protect, Execution and EvalTemplateManager do not.
# These direct dependencies belong only to evals. Instrumentation extras obtain OpenAI
# and OpenTelemetry through their instrumentors; gateway-otel shares the API/SDK below.
jinja2 = {version = ">=3.1.2", optional = true, python = ">=3.11"}
litellm = {version = ">=1.100.4,<2,!=1.101.0,!=1.101.1,!=1.101.2,!=1.102.0,!=1.102.1,!=1.103.0", optional = true, python = ">=3.11,<3.15"}
nltk = {version = ">=3.9.0", optional = true, python = ">=3.11"}
openai = {version = ">=1.109.1,<3", optional = true, python = ">=3.11"}
opentelemetry-exporter-otlp = {version = ">=1.39.1,<2", optional = true, python = ">=3.11"}
pyyaml = {version = ">=6.0", optional = true, python = ">=3.11"}
rouge_score = {version = "==0.1.2", optional = true, python = ">=3.11"}
filelock = {version = ">=4.2.1", optional = true, python = ">=3.11"}
tiktoken = {version = ">=0.5", optional = true}
# Shared by evals and gateway-otel; gateway instrumentation also supports Python 3.10.
# Shared by [evals] (Python 3.11+ at import time, enforced by fi.evals._extras) and the released
# [gateway-otel] extra, which must keep installing on Python 3.10, so the marker is the union (>=3.10).
opentelemetry-api = {version = ">=1.39.1,<2", optional = true, python = ">=3.10"}
opentelemetry-sdk = {version = ">=1.39.1,<2", optional = true, python = ">=3.10"}

[tool.poetry.extras]
tracing = ["fi-instrumentation-otel"]
evals = ["jinja2", "litellm", "nltk", "openai", "opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp", "pyyaml", "rouge_score", "filelock"]
experiments = ["fi-instrumentation-otel", "python-dotenv"]
langgraph = ["fi-instrumentation-otel", "python-dotenv", "traceAI-langchain"]
langchain = ["fi-instrumentation-otel", "python-dotenv", "traceAI-langchain"]
openai-agents = ["fi-instrumentation-otel", "python-dotenv", "traceAI-openai-agents"]
# Custom Python tasks that call the OpenAI SDK directly use its traceAI instrumentor.
openai = ["fi-instrumentation-otel", "python-dotenv", "traceAI-openai"]
# pip install "futureagi[gateway-tokens]" / "futureagi[gateway-otel]"
gateway-tokens = ["tiktoken"]
gateway-otel = ["opentelemetry-api", "opentelemetry-sdk"]

[tool.poetry.scripts]
futureagi-py = "fi._cli.main:main"

# One line per `futureagi-py` command group: NAME = "module with register(subparsers)"
# (fi/_cli/README.md). Each program appends its own lines; the core names none.
[tool.poetry.plugins."futureagi.cli"]
evals = "fi.evals._cli"
experiments = "fi.experiments._cli.commands"
webhooks = "fi.webhooks._cli"
agent_runs = "fi.agents.runs._cli"
agents = "fi.agents.cli"

[tool.poetry.group.dev.dependencies]
# Agent adapter test toolchain; resolve alongside the evals OpenAI dependency.
openai-agents = {version = "0.4.2", python = ">=3.10,<3.14"}
mcp = {version = "1.12.4", python = ">=3.10,<3.14"}
pre-commit = {version = "^4.0.1", python = ">=3.11"}
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
tox = {version = "^4.23.2", python = ">=3.11"}
pytest-xdist = "^3.6"
pytest-asyncio = "^0.24"
pyyaml = "^6.0"
respx = ">=0.21"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["poetry-core==2.0.1"]
build-backend = "poetry.core.masonry.api"
