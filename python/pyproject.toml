[tool.poetry]
name = "futureagi"
version = "0.6.14"
description = "We help GenAI teams maintain high-accuracy for their Models in production."
authors = ["Future AGI <no-reply@futureagi.com>"]
readme = "README.md"
packages = [
    { include = "fi" }
]
exclude = [
    "fi/integrations/otel",
    "fi/evals"
]

[tool.poetry.dependencies]
python = ">=3.10"
certifi = ">=2026.10.18"
charset-normalizer = ">=3.3"
idna = ">=3.15"
numpy = ">=1.26"
pandas = ">=2.0"
python-dateutil = ">=2.9"
pytz = ">=2024.1"
requests = ">=2.33.0"
requests-futures = ">=1.0"
six = ">=1.16"
tzdata = ">=2024.1"
urllib3 = ">=2.8.0"
pydantic = ">=2.9,<3.0"
tqdm = ">=4.67"
Levenshtein = "*"
scipy = ">=1.15.0"
jsonschema = ">=4.25"
# fi.platform (the generated client) and fi.gateway (the AgentCC data-plane client) (the AgentCC data-plane client, vendored from agent-command-center-sdk)
httpx = ">=0.27,<1.0"
anyio = ">=4.14.2,<5.0"
typing-extensions = ">=4.7"
tiktoken = { version = ">=0.5", optional = true }
opentelemetry-api = { version = ">=1.45.1", optional = true }
opentelemetry-sdk = { version = ">=1.45.1", optional = true }

[tool.poetry.extras]
# pip install "futureagi[gateway-tokens]" / "futureagi[gateway-otel]"
gateway-tokens = ["tiktoken"]
gateway-otel = ["opentelemetry-api", "opentelemetry-sdk"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
tox = "^4.23.2"
pyyaml = ">=6.0"
pytest-asyncio = ">=0.23"
respx = ">=0.21"

[tool.pytest.ini_options]
# tests/gateway (ported from agentcc) uses bare `async def` tests
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
